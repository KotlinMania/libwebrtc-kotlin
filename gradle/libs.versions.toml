[versions]
kotlin = "2.4.20"
coroutines = "1.10.2"
serialization = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"
anyhow = "0.1.1"
base64 = "0.1.0"
bytes = "0.2.1"
clap = "0.1.1"
futures = "0.2.0"
http = "0.1.3"
image = "0.1.3"
lazyStatic = "0.1.1"
log = "0.1.4"
onceCell = "0.1.1"
regex = "0.1.0"
serde = "0.1.10"
sha2 = "0.1.0"
thiserror = "0.2.0"
tokio = "0.1.1"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
anyhow-kotlin = { module = "io.github.kotlinmania:anyhow-kotlin", version.ref = "anyhow" }
base64-kotlin = { module = "io.github.kotlinmania:base64-kotlin", version.ref = "base64" }
bytes-kotlin = { module = "io.github.kotlinmania:bytes-kotlin", version.ref = "bytes" }
clap-kotlin = { module = "io.github.kotlinmania:clap-kotlin", version.ref = "clap" }
futures-kotlin = { module = "io.github.kotlinmania:futures-kotlin", version.ref = "futures" }
http-kotlin = { module = "io.github.kotlinmania:http-kotlin", version.ref = "http" }
image-kotlin = { module = "io.github.kotlinmania:image-kotlin", version.ref = "image" }
lazy-static-kotlin = { module = "io.github.kotlinmania:lazy-static-kotlin", version.ref = "lazyStatic" }
log-kotlin = { module = "io.github.kotlinmania:log-kotlin", version.ref = "log" }
once-cell-kotlin = { module = "io.github.kotlinmania:once-cell-kotlin", version.ref = "onceCell" }
regex-kotlin = { module = "io.github.kotlinmania:regex-kotlin", version.ref = "regex" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
sha2-kotlin = { module = "io.github.kotlinmania:sha2-kotlin", version.ref = "sha2" }
thiserror-kotlin = { module = "io.github.kotlinmania:thiserror-kotlin", version.ref = "thiserror" }
tokio-kotlin = { module = "io.github.kotlinmania:tokio-kotlin", version.ref = "tokio" }

[bundles]
libwebrtc-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-serialization-core",
  "kotlinx-serialization-json",
  "kotlinx-datetime",
  "collections-immutable",
  "anyhow-kotlin",
  "base64-kotlin",
  "bytes-kotlin",
  "futures-kotlin",
  "http-kotlin",
  "image-kotlin",
  "lazy-static-kotlin",
  "log-kotlin",
  "once-cell-kotlin",
  "regex-kotlin",
  "serde-kotlin",
  "sha2-kotlin",
  "thiserror-kotlin",
  "tokio-kotlin",
]
libwebrtc-commonTest = [
  "kotlinx-coroutines-test",
]
